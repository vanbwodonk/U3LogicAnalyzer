name: Build U3LogicAnalyzer

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            qt6-base-dev libqt6svg6-dev \
            libglib2.0-dev libglibmm-2.4-dev libusb-1.0-0-dev \
            libserialport-dev libftdi1-dev nettle-dev libieee1284-3-dev \
            libbluetooth-dev libhidapi-dev libzip-dev libboost-dev \
            libboost-filesystem-dev libboost-serialization-dev \
            libboost-test-dev python3-dev

      - name: Build
        env:
          LIBSIGROK_URL: ${{ vars.LIBSIGROK_URL }}
          LIBSIGROKDECODE_URL: ${{ vars.LIBSIGROKDECODE_URL }}
        run: ./build_macos.sh

      - name: Run tests
        run: |
          set -e
          PREFIX="$PWD/build/install"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cmake -S . -B build/test_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DENABLE_TESTS=ON -DENABLE_DECODE=ON \
            -DENABLE_FLOW=OFF -DENABLE_SIGNALS=OFF \
            -DDISABLE_WERROR=ON
          cmake --build build/test_build -j 4 --target pulseview-test
          ctest --test-dir build/test_build --output-on-failure

      - name: Package Linux tarball
        run: |
          mkdir -p dist/U3LogicAnalyzer-linux/bin \
                   dist/U3LogicAnalyzer-linux/share/libsigrokdecode
          cp build/pulseview_build/LogicAnalyzer dist/U3LogicAnalyzer-linux/bin/
          cp -R build/install/share/libsigrokdecode/decoders \
                dist/U3LogicAnalyzer-linux/share/libsigrokdecode/
          tar -C dist -czf build/U3LogicAnalyzer-linux.tar.gz U3LogicAnalyzer-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-${{ github.ref_name }}
          path: build/U3LogicAnalyzer-linux.tar.gz
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/U3LogicAnalyzer-linux.tar.gz
          generate_release_notes: true
